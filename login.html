<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Ingresar | Helping Food
  </title>
  <link href="css/styles.css" rel="stylesheet"/>
  <script defer="" src="js/app.js">
  </script>
 </head>
 <body>
  <header class="site-header">
   <a class="brand" href="index.html">
    <span class="brand-mark">
     HF
    </span>
    <span>
     Helping
     <span class="brand-accent">
      Food
     </span>
    </span>
   </a>
   <a class="text-link" href="index.html">
    &larr; Volver al inicio
   </a>
  </header>
  <main class="form-page">
   <section class="form-panel auth-panel">
    <span class="eyebrow">
     QU&Eacute; BUENO VERTE
    </span>
    <h1>
     Inicia sesi&oacute;n
    </h1>
    <p class="form-intro">
     Accede a la demostraci&oacute;n de Helping Food.
    </p>
    <form class="form-grid" id="login-form">
     <label>
      Correo electr&oacute;nico
      <input autocomplete="email" id="login-email" placeholder="correo@ejemplo.com" required="" type="email"/>
     </label>
     <label>
      Contrase&ntilde;a
      <input autocomplete="current-password" id="login-password" minlength="6" placeholder="M&iacute;nimo 6 caracteres" required="" type="password"/>
     </label>
     <button class="btn btn-primary btn-full" type="submit">
      Ingresar
     </button>
     <p aria-live="polite" class="form-message" id="login-message">
     </p>
    </form>
    <p class="auth-switch">
     &iquest;A&uacute;n no tienes una cuenta?
     <a href="registrar.html">
      Reg&iacute;strate
     </a>
    </p>
    <p class="form-note">
     El acceso es una simulaci&oacute;n local. No ingreses contrase&ntilde;as reales: no existe autenticaci&oacute;n segura ni servidor.
    </p>
   </section>
  </main>
 </body>
</html>
