<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Registro | Helping Food
  </title>
  <link href="css/styles.css" rel="stylesheet"/>
  <script defer="" src="js/app.js">
  </script>
 </head>
 <body>
  <header class="site-header">
   <a class="brand" href="index.html">
    <span class="brand-mark">
     HF
    </span>
    <span>
     Helping
     <span class="brand-accent">
      Food
     </span>
    </span>
   </a>
   <a class="text-link" href="index.html">
    &larr; Volver al inicio
   </a>
  </header>
  <main class="form-page">
   <section class="form-panel auth-panel">
    <span class="eyebrow">
     &Uacute;NETE A LA COMUNIDAD
    </span>
    <h1>
     Crea tu cuenta
    </h1>
    <p class="form-intro">
     Completa los datos para probar el registro.
    </p>
    <form class="form-grid" id="register-form">
     <label>
      Nombre completo
      <input autocomplete="name" id="register-name" maxlength="80" placeholder="Tu nombre" required=""/>
     </label>
     <label>
      Correo electr&oacute;nico
      <input autocomplete="email" id="register-email" placeholder="correo@ejemplo.com" required="" type="email"/>
     </label>
     <label>
      Contrase&ntilde;a
      <input id="register-password" minlength="6" placeholder="M&iacute;nimo 6 caracteres" required="" type="password"/>
     </label>
     <label>
      Confirmar contrase&ntilde;a
      <input id="register-confirm" minlength="6" placeholder="Repite tu contrase&ntilde;a" required="" type="password"/>
     </label>
     <button class="btn btn-primary btn-full" type="submit">
      Crear cuenta de prueba
     </button>
     <p aria-live="polite" class="form-message" id="register-message">
     </p>
    </form>
    <p class="auth-switch">
     &iquest;Ya tienes cuenta?
     <a href="login.html">
      Inicia sesi&oacute;n
     </a>
    </p>
    <p class="form-note">
     Demostraci&oacute;n local: los datos se guardan en este navegador. No uses contrase&ntilde;as personales.
    </p>
   </section>
  </main>
 </body>
</html>
